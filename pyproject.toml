[project]
name = "ki-trader-arena"
version = "0.1.0"
description = "KI-Trader-Arena: Papierhandel-Experiment mit KI-Agenten (nur Simulation)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "anthropic>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["arena", "arena.exchange", "arena.data", "arena.agent"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
