name: Tests
on:
  push:
    branches: [main]
    paths: ['arena/**', 'tests/**', 'pyproject.toml']
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q
