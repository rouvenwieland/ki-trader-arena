name: Wochen-Review
on:
  schedule:
    - cron: '23 18 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arena-zustand
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Opus-Strategie-Review
        env:
          ARENA_ANTHROPIC_KEY: ${{ secrets.ARENA_ANTHROPIC_KEY }}
        run: uv run python -m arena.review
      - name: Speichern
        run: 'bash scripts/speichern.sh "Wochen-Review $(date -u +%Y-%m-%d)"'
