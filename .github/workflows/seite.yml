name: Webseite
on:
  # Der Dauerlauf stößt die Seite per workflow_dispatch nach jedem Tick an; workflow_run bleibt für die Rückfall-Workflows.
  workflow_run:
    workflows: ['Wächter', 'Entscheider', 'Wochen-Review']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    continue-on-error: true   # Pages evtl. noch nicht aktiviert → Workflow bleibt grün
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: data.json/status.json frisch aus data/ bauen (data.json liegt nicht im Git – spart ~2 MB Repo-Wachstum pro Tag)
        run: uv sync --frozen --no-dev && uv run python -m arena.site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
